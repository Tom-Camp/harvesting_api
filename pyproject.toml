[project]
name = "harvest-food"
version = "0.1.0"
description = "AI-powered garden management API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "fastapi[standard]>=0.135.1",
    "pydantic[email]>=2.12.5",
    "pydantic-ai>=1.68.0",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.22",
    "structlog>=25.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "commitizen>=4.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 109
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]  # line length enforced by ruff-format

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
